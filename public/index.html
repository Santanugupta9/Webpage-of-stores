<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dai Bhai Khadya Stores | Order Desk</title><style>
:root{--ink:#17251f;--muted:#748078;--line:#e4eae5;--green:#176b4d;--mint:#e9f5ed;--orange:#f4a64b;--bg:#f6f8f5;--red:#bd5145}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{min-height:100vh;display:grid;grid-template-columns:236px 1fr}.side{background:#143f30;color:white;padding:25px 17px;display:flex;flex-direction:column;gap:24px}.brand{display:flex;gap:11px;align-items:center;padding:0 8px}.logo{width:42px;height:42px;background:var(--orange);border-radius:13px;display:grid;place-items:center;color:#143f30;font-size:21px;font-weight:900}.brand b{display:block;font-size:15px}.brand small{color:#b7d3c3}.nav{display:grid;gap:7px}.nav button{border:0;text-align:left;color:#c8dbd0;background:transparent;padding:12px;border-radius:10px}.nav button.active,.nav button:hover{background:#ffffff1b;color:#fff}.nav button span{display:inline-block;width:27px}.sidefoot{margin-top:auto;border-top:1px solid #ffffff26;padding:16px 8px;color:#c7dbd0;font-size:12px}.main{min-width:0}.top{height:76px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px}.crumb{color:var(--muted)}.topright{display:flex;align-items:center;gap:14px}.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#dcefe2;color:var(--green);font-weight:800}.page{padding:29px 32px;max-width:1500px;margin:auto}.welcome{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:25px}.eyebrow{text-transform:uppercase;letter-spacing:1.5px;color:var(--green);font-size:10px;font-weight:800}.h1{font-size:28px;line-height:1.2;letter-spacing:-.8px;margin:7px 0}.sub{color:var(--muted);margin:0}.btn{border:1px solid var(--line);background:white;color:var(--ink);padding:10px 14px;border-radius:10px;font-weight:650;display:inline-flex;align-items:center;gap:7px}.btn.primary{background:var(--green);border-color:var(--green);color:white}.btn.soft{background:var(--mint);border-color:var(--mint);color:var(--green)}.btn.danger{color:var(--red)}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:26px}.stat,.panel,.ordercol,.productrow{background:white;border:1px solid var(--line);border-radius:15px}.stat{padding:18px}.stathead{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.staticon{width:34px;height:34px;background:var(--mint);color:var(--green);display:grid;place-items:center;border-radius:10px;font-size:17px}.statnum{font-size:29px;font-weight:780;letter-spacing:-1px;margin:13px 0 3px}.statnote{font-size:11px;color:var(--muted)}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:25px 0 15px}.sectionhead h2{font-size:17px;margin:0}.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.ordercol{padding:15px;min-height:260px;background:#fbfcfa}.colhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px;font-weight:750}.count{background:#e8eee8;border-radius:8px;padding:2px 8px;color:#607168;font-size:11px}.ordercard{background:white;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}.orderline{display:flex;justify-content:space-between;gap:8px}.orderid{font-weight:800}.pill{display:inline-block;padding:4px 8px;border-radius:7px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px}.pill.waiting{background:#fff1d9;color:#986019}.pill.dispatch{background:#dff4e6;color:#176b4d}.pill.cancel{background:#fae6e3;color:#a73f35}.shop{font-weight:700;margin-top:10px}.meta{color:var(--muted);font-size:12px}.itemline{display:flex;justify-content:space-between;color:#53645a;font-size:12px;margin-top:8px;gap:8px}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}.actions .btn{font-size:11px;padding:7px 9px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:17px}.field{border:1px solid #dce4dd;background:white;border-radius:10px;padding:11px 12px;min-width:0;width:100%;outline:none}.field:focus{border-color:#5b9a7c;box-shadow:0 0 0 3px #e4f4e9}.search{flex:1;min-width:190px}.tablewrap{overflow:auto;background:white;border:1px solid var(--line);border-radius:14px}.table{border-collapse:collapse;width:100%;white-space:nowrap}.table th,.table td{text-align:left;padding:13px 16px;border-bottom:1px solid #edf0ed}.table th{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);background:#fafcf9}.table tr:last-child td{border-bottom:0}.prodcell{display:flex;align-items:center;gap:11px}.thumb{width:42px;height:42px;border-radius:9px;background:#f3f5f1;object-fit:contain}.price{font-weight:700}.empty{padding:30px;text-align:center;color:var(--muted)}.hidden{display:none!important}.overlay{position:fixed;inset:0;background:#10291f6b;z-index:5;display:grid;place-items:center;padding:16px}.modal{background:white;border-radius:17px;padding:23px;width:min(620px,100%);max-height:90vh;overflow:auto;box-shadow:0 25px 80px #10291f30}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modalhead h3{margin:0;font-size:19px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.formfield{display:grid;gap:6px}.formfield label{font-size:12px;color:#506158;font-weight:700}.formfield.full{grid-column:1/-1}.modalfoot{display:flex;justify-content:flex-end;gap:9px;margin-top:19px}.notice{padding:11px 13px;border-radius:10px;margin-bottom:15px;background:#e6f4e9;color:#176b4d}.notice.error{background:#fae6e3;color:#a73f35}.loginbg{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 15% 10%,#d8ecdc,transparent 35%),#f6f8f5}.login{width:min(440px,100%);background:white;padding:30px;border:1px solid var(--line);border-radius:20px;box-shadow:0 25px 80px #23453312}.login .brand{padding:0;margin-bottom:28px}.login .brand small{color:var(--muted)}.login h1{font-size:26px;margin:0 0 7px}.loginform{display:grid;gap:14px;margin-top:22px}.loginform .btn{justify-content:center;padding:12px}.help{font-size:12px;color:var(--muted)}.noticebar{font-size:12px;background:#fff3db;color:#83571c;border-radius:9px;padding:10px 12px;margin:15px 0}.cartlayout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px}.catalog{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.catalogitem{border:1px solid var(--line);background:white;border-radius:13px;padding:13px;min-width:0}.catalogitem img{height:100px;width:100%;object-fit:contain;background:#fafbf9;border-radius:9px}.catalogitem b{display:block;margin:9px 0 3px}.qtyrow{display:flex;gap:8px;margin-top:10px}.qtyrow input{width:75px}.cartpanel{padding:17px;align-self:start}.cartline{border-bottom:1px solid var(--line);padding:10px 0}.toast{position:fixed;right:20px;bottom:20px;background:#143f30;color:white;padding:13px 17px;border-radius:11px;z-index:10;box-shadow:0 8px 25px #0002}.mobiletop{display:none}
@media(max-width:1050px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.board{grid-template-columns:1fr}.ordercol{min-height:0}.catalog{grid-template-columns:repeat(2,minmax(0,1fr))}.cartlayout{grid-template-columns:1fr}.shell{grid-template-columns:200px 1fr}.page{padding:24px 20px}.top{padding:0 20px}}
@media(max-width:700px){.shell{display:block}.side{display:none}.top{height:64px;padding:0 15px}.mobiletop{display:inline-flex}.page{padding:22px 14px}.welcome{display:block}.welcome>.btn{margin-top:15px}.h1{font-size:25px}.stats{gap:9px}.stat{padding:13px}.statnum{font-size:25px}.stathead{font-size:11px}.stats .statnote{font-size:10px}.board{gap:10px}.catalog{grid-template-columns:repeat(2,minmax(0,1fr))}.formgrid{grid-template-columns:1fr}.formfield.full{grid-column:auto}.topright .rolelabel{display:none}.cartlayout{display:block}.cartpanel{margin-top:15px}.table th,.table td{padding:11px}.mobile-menu{position:absolute;top:60px;left:10px;z-index:3;background:white;box-shadow:0 10px 35px #0002;border-radius:12px;padding:8px;display:grid;min-width:170px}.mobile-menu button{border:0;background:white;text-align:left;padding:11px;border-radius:7px}.mobile-menu button:hover{background:var(--mint)}}
</style></head><body><div id="app"><div class="loginbg"><div class="login"><div class="brand"><div class="logo">DB</div><div><b>Dai Bhai Khadya Stores</b><small>Sales & dispatch workspace</small></div></div><p>Loading your workspace…</p></div></div></div><div id="modalroot"></div><div id="toastroot"></div><script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
let token=localStorage.getItem("db_token")||"",me=null,products=[],customers=[],orders=[],users=[],page="overview",query="",category="",cart=[],editingOrder=null;
const imageBase="https://raw.githubusercontent.com/Santanugupta9/Webpage-of-stores/main/";
const imgFor=p=>p.image?(p.image.startsWith("http")?p.image:imageBase+encodeURIComponent(p.image)): "";
const money=n=>n==null||n===""?"—":"Rs. "+Number(n).toLocaleString("en-IN",{maximumFractionDigits:2});
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const api=async(url,opt={})=>{const headers={...(opt.body instanceof FormData?{}:{"Content-Type":"application/json"}),...(token?{Authorization:"Bearer "+token}:{}),...(opt.headers||{})};const r=await fetch("/api"+url,{...opt,headers});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||"Something went wrong");return d};
function toast(s){$("#toastroot").innerHTML='<div class="toast">'+esc(s)+'</div>';setTimeout(()=>$("#toastroot").innerHTML="",2800)}
function brand(){return '<div class="brand"><div class="logo">DB</div><div><b>Dai Bhai Khadya Stores</b><small>Order management</small></div></div>'}
async function init(){try{const status=await api("/setup-status");if(!token){login(status.needsOwner);return}const m=await api("/auth/me");me=m.user;await loadAll();render()}catch(e){token="";localStorage.removeItem("db_token");login(false,e.message)}}
function login(needsOwner=false,error=""){page="login";$("#app").innerHTML='<div class="loginbg"><div class="login">'+brand()+'<div class="eyebrow">Internal workspace</div><h1>'+(needsOwner?"Set up your owner account":"Welcome back")+'</h1><p class="sub">'+(needsOwner?"Create the private account that controls dispatch and product management.":"Sign in to create retail orders and track dispatch.")+'</p>'+(error?'<div class="notice error" style="margin-top:15px">'+esc(error)+'</div>':'')+'<form id="loginform" class="loginform">'+(needsOwner?'<div class="formfield"><label>Owner name</label><input class="field" name="name" required placeholder="Store owner"></div>':'')+'<div class="formfield"><label>Email address</label><input class="field" type="email" name="email" required placeholder="you@store.com"></div><div class="formfield"><label>Password</label><input class="field" type="password" name="password" minlength="10" required placeholder="At least 10 characters"></div>'+(needsOwner?'<div class="formfield"><label>Setup key (if configured)</label><input class="field" name="setupKey" placeholder="Optional"></div>':'')+'<button class="btn primary" type="submit">'+(needsOwner?"Create owner account":"Sign in")+' →</button></form><p class="help" style="margin-top:18px">Private store workspace · Access is assigned by the owner</p></div></div>';$("#loginform").onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.currentTarget));try{const d=await api(needsOwner?"/setup":"/auth/login",{method:"POST",body:JSON.stringify(f)});token=d.token;me=d.user;localStorage.setItem("db_token",token);await loadAll();render()}catch(err){login(needsOwner,err.message)}}}
async function loadAll(){[products,customers,orders]=await Promise.all([api("/products"),api("/customers"),api("/orders")]);if(me.role==="owner")users=await api("/users")}
const navs=[["overview","▦","Overview"],["orders","▤","Orders"],["neworder","＋","Create order"],["products","▣","Products"],["customers","♙","Retailers"],["team","♧","Sales team"]];
function render(){if(!me)return;$("#app").innerHTML='<div class="shell"><aside class="side">'+brand()+'<div class="nav">'+navs.filter(n=>me.role==="owner"||!["products","customers","team"].includes(n[0])).map(n=>'<button data-page="'+n[0]+'" class="'+(page===n[0]?"active":"")+'"><span>'+n[1]+'</span>'+n[2]+'</button>').join("")+'</div><div class="sidefoot">Signed in as <b>'+esc(me.name)+'</b><br>'+esc(me.role==="owner"?"Owner · Full access":"Salesman · Order access")+'<br><br>© Dai Bhai Khadya Stores</div></aside><main class="main"><header class="top"><div style="display:flex;align-items:center;gap:12px"><button class="btn mobiletop" id="mobiletoggle">☰</button><div><b>'+esc(pageTitle())+'</b><div class="crumb" style="font-size:11px">Dai Bhai / '+esc(pageTitle())+'</div></div></div><div class="topright"><span class="rolelabel" style="font-size:12px;color:var(--muted)">'+esc(me.role==="owner"?"Owner workspace":"Sales workspace")+'</span><div class="avatar">'+esc(me.name.split(" ").map(x=>x[0]).slice(0,2).join("").toUpperCase())+'</div><button class="btn" id="logout">Sign out</button></div></header><section class="page">'+view()+'</section></main></div>';$$("[data-page]").forEach(b=>b.onclick=()=>{page=b.dataset.page;cart=[];render()});$("#logout").onclick=()=>{token="";me=null;localStorage.removeItem("db_token");login(false)};$("#mobiletoggle").onclick=()=>{const old=$(".mobile-menu");if(old){old.remove();return}const m=document.createElement("div");m.className="mobile-menu";m.innerHTML=navs.filter(n=>me.role==="owner"||!["products","customers","team"].includes(n[0])).map(n=>'<button data-mpage="'+n[0]+'">'+n[1]+'　'+n[2]+'</button>').join("");$(".top").append(m);$$("[data-mpage]").forEach(b=>b.onclick=()=>{page=b.dataset.mpage;render()})};bindPage()}
function pageTitle(){return ({overview:"Overview",orders:"Order board",neworder:"Create retail order",products:"Product catalogue",customers:"Retailers",team:"Sales team"})[page]||"Overview"}
function view(){if(page==="overview")return overview();if(page==="orders")return orderBoard();if(page==="neworder")return newOrder();if(page==="products")return productPage();if(page==="customers")return customerPage();if(page==="team")return teamPage();return overview()}
function stat(label,num,note,icon){return '<div class="stat"><div class="stathead"><span>'+label+'</span><span class="staticon">'+icon+'</span></div><div class="statnum">'+num+'</div><div class="statnote">'+note+'</div></div>'}
function overview(){const waiting=orders.filter(o=>o.status==="waiting"),dispatch=orders.filter(o=>o.status==="dispatch"),cancel=orders.filter(o=>o.status==="cancel"),today=new Date().toDateString(),todayCount=orders.filter(o=>new Date(o.created_at+"Z").toDateString()===today).length;return '<div class="welcome"><div><div class="eyebrow">Store operations</div><h1 class="h1">Good '+(new Date().getHours()<12?"morning":new Date().getHours()<17?"afternoon":"evening")+', '+esc(me.name.split(" ")[0])+' 👋</h1><p class="sub">Here is what is happening with your retail orders today.</p></div><button class="btn primary" data-goto="neworder">＋ Create new order</button></div><div class="stats">'+stat("Waiting orders",waiting.length,"Needs review or dispatch","◷")+stat("Dispatched",dispatch.length,"Approved by owner","✓")+stat("Retailers",customers.length,"Shops in your directory","♙")+stat("Products",products.length,"Active catalogue items","▦")+'</div><div class="sectionhead"><h2>Order board</h2><button class="btn" data-goto="orders">View all orders →</button></div>'+boardMarkup(true)+'</div>'}
function boardMarkup(compact=false){const groups=[["waiting","Waiting","Awaiting owner approval"],["dispatch","Dispatch","Approved for dispatch"],["cancel","Cancel","Cancelled orders"]];return '<div class="board">'+groups.map(([key,title,desc])=>{const list=orders.filter(o=>o.status===key);return '<div class="ordercol"><div class="colhead"><span>'+title+'</span><span class="count">'+list.length+'</span></div>'+list.slice(0,compact?3:100).map(orderCard).join("")+(list.length===0?'<div class="empty">No '+title.toLowerCase()+' orders yet.</div>':"")+(compact&&list.length>3?'<button class="btn" data-goto="orders">See all '+list.length+'</button>':"")+'</div>'}).join("")+'</div>'}
function orderCard(o){const total=o.items.reduce((s,i)=>s+(Number(i.unit_price)||0)*Number(i.quantity),0);return '<article class="ordercard"><div class="orderline"><span class="orderid">#DB-'+String(o.id).padStart(4,"0")+'</span><span class="pill '+o.status+'">'+o.status+'</span></div><div class="shop">'+esc(o.shop_name||o.customer_name)+'</div><div class="meta">'+esc(o.salesman_name)+' · '+new Date(o.created_at+"Z").toLocaleString()+'</div>'+o.items.slice(0,3).map(i=>'<div class="itemline"><span>'+esc(i.product_name)+'</span><b>× '+i.quantity+'</b></div>').join("")+(o.items.length>3?'<div class="meta">+'+(o.items.length-3)+' more items</div>':"")+'<div class="orderline" style="margin-top:12px"><span class="meta">'+o.items.length+' lines</span><b>'+ (total?money(total):"Price not set")+'</b></div><div class="actions">'+(o.status==="waiting"&&(me.role==="owner"||o.salesman_id===me.id)?'<button class="btn" data-edit-order="'+o.id+'">Edit</button>':"")+'<button class="btn" data-whatsapp="'+o.id+'">↗ WhatsApp</button>'+(me.role==="owner"&&o.status==="waiting"?'<button class="btn soft" data-status="dispatch" data-id="'+o.id+'">✓ Dispatch</button><button class="btn danger" data-status="cancel" data-id="'+o.id+'">Cancel</button>':"")+'</div></article>'}
function orderBoard(){return '<div class="welcome"><div><div class="eyebrow">Live workflow</div><h1 class="h1">Order board</h1><p class="sub">Salesmen submit orders to Waiting. Only the owner can Dispatch or Cancel.</p></div><button class="btn primary" data-goto="neworder">＋ New order</button></div><div class="noticebar">Dispatch permission is owner-only. Orders in Dispatch or Cancel are locked from editing.</div>'+boardMarkup(false)}
function productPage(){return '<div class="welcome"><div><div class="eyebrow">Master data</div><h1 class="h1">Product catalogue</h1><p class="sub">Search the existing store range and maintain product details.</p></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="importbtn">↑ Import Excel</button><button class="btn primary" id="addproduct">＋ Add product</button></div></div><div class="toolbar"><input class="field search" id="productsearch" placeholder="Search product, category or SKU…" value="'+esc(query)+'"><select class="field" style="max-width:220px" id="categoryfilter"><option value="">All categories</option>'+[...new Set(products.map(p=>p.category))].sort().map(c=>'<option '+(category===c?"selected":"")+'>'+esc(c)+'</option>').join("")+'</select><span class="btn">'+products.length+' items</span></div><div class="tablewrap"><table class="table"><thead><tr><th>Product</th><th>Category</th><th>SKU</th><th>Reference price</th><th>Actions</th></tr></thead><tbody>'+filteredProducts().map(p=>'<tr><td><div class="prodcell"><img class="thumb" src="'+esc(imgFor(p))+'" onerror="this.onerror=null;this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 80 80%22%3E%3Crect width=%2280%22 height=%2280%22 rx=%2210%22 fill=%22%23e9f5ed%22/%3E%3Ctext x=%2240%22 y=%2248%22 text-anchor=%22middle%22 font-size=%2228%22 fill=%22%23176b4d%22%3E%E2%97%86%3C/text%3E%3C/svg%3E'"><div><b>'+esc(p.name)+'</b><div class="meta">ID '+p.id+'</div></div></div></td><td>'+esc(p.category)+'</td><td>'+esc(p.sku||"—")+'</td><td class="price">'+money(p.price)+'</td><td><button class="btn" data-edit-product="'+p.id+'">Edit</button> <button class="btn danger" data-delete-product="'+p.id+'">Archive</button></td></tr>').join("")+'</tbody></table>'+(filteredProducts().length?"":'<div class="empty">No matching products found.</div>')+'</div><p class="help" style="margin-top:12px">Legacy prices are reference values. Verify current rates before using for billing. Missing images can be replaced with verified URLs.</p>'}
function filteredProducts(){return products.filter(p=>(!query||(p.name+" "+p.category+" "+(p.sku||"")).toLowerCase().includes(query.toLowerCase()))&&(!category||p.category===category))}
function customerPage(){return '<div class="welcome"><div><div class="eyebrow">Customer directory</div><h1 class="h1">Retailers & shops</h1><p class="sub">Choose the correct retail shop for every salesman order.</p></div><button class="btn primary" id="addcustomer">＋ Add retailer</button></div><div class="toolbar"><input class="field search" id="customersearch" placeholder="Search shop, contact or phone…"></div><div class="tablewrap"><table class="table"><thead><tr><th>Retailer / shop</th><th>Phone</th><th>Address</th><th>Actions</th></tr></thead><tbody>'+customers.map(c=>'<tr data-customer-row="'+c.id+'"><td><b>'+esc(c.shop_name||c.name)+'</b><div class="meta">'+esc(c.name)+'</div></td><td>'+esc(c.phone||"—")+'</td><td>'+esc(c.address||"—")+'</td><td><button class="btn" data-edit-customer="'+c.id+'">Edit</button></td></tr>').join("")+'</tbody></table>'+(customers.length?"":'<div class="empty">No retailers yet. Add your first retail shop.</div>')+'</div>'}
function teamPage(){return '<div class="welcome"><div><div class="eyebrow">Access control</div><h1 class="h1">Sales team</h1><p class="sub">Only the owner can create salesman logins and dispatch orders.</p></div><button class="btn primary" id="adduser">＋ Add salesman</button></div><div class="tablewrap"><table class="table"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Added</th></tr></thead><tbody>'+users.map(u=>'<tr><td><b>'+esc(u.name)+'</b></td><td>'+esc(u.email)+'</td><td><span class="pill '+(u.role==="owner"?"dispatch":"waiting")+'">'+esc(u.role)+'</span></td><td>'+new Date(u.created_at+"Z").toLocaleDateString()+'</td></tr>').join("")+'</tbody></table></div>'}
function newOrder(){return '<div class="welcome"><div><div class="eyebrow">Sales entry</div><h1 class="h1">'+(editingOrder?"Edit waiting order":"Create retail order")+'</h1><p class="sub">Build an order for a retailer, then share it to WhatsApp if needed.</p></div></div><div class="cartlayout"><div><div class="toolbar"><select class="field" id="retailer" style="max-width:320px"><option value="">Choose retailer / shop</option>'+customers.map(c=>'<option value="'+c.id+'">'+esc(c.shop_name||c.name)+'</option>').join("")+'</select><input class="field search" id="catalogsearch" placeholder="Search products to add…"><select class="field" id="catalogcat" style="max-width:190px"><option value="">All categories</option>'+[...new Set(products.map(p=>p.category))].sort().map(c=>'<option>'+esc(c)+'</option>').join("")+'</select></div><div class="catalog" id="cataloggrid">'+catalogMarkup()+'</div></div><div class="panel cartpanel"><h2 style="margin:0 0 5px">Order items</h2><p class="sub">Quantities can be cases, packs or individual units.</p><div id="cartlines">'+cartMarkup()+'</div><div class="formfield" style="margin-top:14px"><label>Order note (optional)</label><textarea class="field" id="ordernote" rows="3" placeholder="Delivery notes or special instructions">'+esc(editingOrder?editingOrder.note||"":"")+'</textarea></div><div style="display:flex;justify-content:space-between;margin:18px 0;font-weight:800"><span>Reference total</span><span>'+money(cart.reduce((s,i)=>s+(Number(i.price)||0)*i.quantity,0))+'</span></div><button class="btn primary" style="width:100%;justify-content:center" id="submitorder">'+(editingOrder?"Save changes":"Submit to Waiting")+' →</button><p class="help" style="margin-top:12px">Submitting will not dispatch or deduct stock. Owner approval is required.</p></div></div>'}
function catalogMarkup(){const q=($("#catalogsearch")?.value||"").toLowerCase(),cat=$("#catalogcat")?.value||"";return filteredCatalog(q,cat).map(p=>'<div class="catalogitem"><img src="'+esc(imgFor(p))+'" onerror="this.style.opacity=.25"><b>'+esc(p.name)+'</b><div class="meta">'+esc(p.category)+' · '+money(p.price)+'</div><div class="qtyrow"><input class="field" type="number" min="1" step="1" value="1" id="qty-'+p.id+'"><button class="btn soft" data-addcart="'+p.id+'">＋ Add</button></div></div>').join("")||'<div class="empty">No products match your search.</div>'}
function filteredCatalog(q,cat){return products.filter(p=>(!q||(p.name+" "+p.category).toLowerCase().includes(q))&&(!cat||p.category===cat)).slice(0,120)}
function cartMarkup(){return cart.map(i=>'<div class="cartline"><div class="orderline"><b>'+esc(i.name)+'</b><button class="btn danger" style="padding:3px 7px" data-remove-cart="'+i.id+'">×</button></div><div class="itemline"><span>'+money(i.price)+' each</span><div style="display:flex;align-items:center;gap:7px"><button class="btn" style="padding:2px 7px" data-qminus="'+i.id+'">−</button><b>'+i.quantity+'</b><button class="btn" style="padding:2px 7px" data-qplus="'+i.id+'">+</button></div></div></div>').join("")||'<div class="empty">Add products to start an order.</div>'}
function bindPage(){ $$("[data-goto]").forEach(b=>b.onclick=()=>{page=b.dataset.goto;editingOrder=null;cart=[];render()});$$("[data-status]").forEach(b=>b.onclick=async()=>{if(!confirm((b.dataset.status==="dispatch"?"Dispatch":"Cancel")+" order #DB-"+b.dataset.id+"?"))return;try{await api("/orders/"+b.dataset.id+"/status",{method:"PATCH",body:JSON.stringify({status:b.dataset.status})});await loadAll();render();toast("Order updated")}catch(e){toast(e.message)}});$$("[data-whatsapp]").forEach(b=>b.onclick=()=>shareOrder(Number(b.dataset.whatsapp)));$$("[data-edit-order]").forEach(b=>b.onclick=()=>editOrder(Number(b.dataset.editOrder)));$("#addproduct")?.addEventListener("click",()=>productModal());$("#importbtn")?.addEventListener("click",importModal);$("#productsearch")?.addEventListener("input",e=>{query=e.target.value;const pos=e.target.selectionStart;render();$("#productsearch").focus();$("#productsearch").setSelectionRange(pos,pos)});$("#categoryfilter")?.addEventListener("change",e=>{category=e.target.value;render()});$$("[data-edit-product]").forEach(b=>b.onclick=()=>productModal(products.find(p=>p.id===Number(b.dataset.editProduct))));$$("[data-delete-product]").forEach(b=>b.onclick=async()=>{const p=products.find(x=>x.id===Number(b.dataset.deleteProduct));if(!confirm("Archive "+p.name+" from the active catalogue?"))return;try{await api("/products/"+p.id,{method:"DELETE"});await loadAll();render();toast("Product archived")}catch(e){toast(e.message)}});$("#addcustomer")?.addEventListener("click",()=>customerModal());$$("[data-edit-customer]").forEach(b=>b.onclick=()=>customerModal(customers.find(c=>c.id===Number(b.dataset.editCustomer))));$("#customersearch")?.addEventListener("input",e=>$$("[data-customer-row]").forEach(r=>r.classList.toggle("hidden",!r.innerText.toLowerCase().includes(e.target.value.toLowerCase()))));$("#adduser")?.addEventListener("click",userModal);$("#catalogsearch")?.addEventListener("input",()=>{$("#cataloggrid").innerHTML=catalogMarkup();bindCartButtons()});$("#catalogcat")?.addEventListener("change",()=>{$("#cataloggrid").innerHTML=catalogMarkup();bindCartButtons()});bindCartButtons();$("#submitorder")?.addEventListener("click",submitOrder)}
function bindCartButtons(){$$("[data-addcart]").forEach(b=>b.onclick=()=>{const p=products.find(x=>x.id===Number(b.dataset.addcart)),qty=Number($("#qty-"+p.id)?.value||1);if(qty<=0)return toast("Quantity must be positive");const old=cart.find(x=>x.id===p.id);if(old)old.quantity+=qty;else cart.push({id:p.id,name:p.name,price:p.price,quantity:qty});$("#cartlines").innerHTML=cartMarkup();$("#submitorder").previousElementSibling.innerHTML="<span>Reference total</span><span>"+money(cart.reduce((s,i)=>s+(Number(i.price)||0)*i.quantity,0))+"</span>";bindCartButtons()});$$("[data-remove-cart]").forEach(b=>b.onclick=()=>{cart=cart.filter(i=>i.id!==Number(b.dataset.removeCart));$("#cartlines").innerHTML=cartMarkup();bindCartButtons()});$$("[data-qplus]").forEach(b=>b.onclick=()=>{cart.find(i=>i.id===Number(b.dataset.qplus)).quantity++;$("#cartlines").innerHTML=cartMarkup();bindCartButtons()});$$("[data-qminus]").forEach(b=>b.onclick=()=>{const i=cart.find(i=>i.id===Number(b.dataset.qminus));i.quantity=Math.max(1,i.quantity-1);$("#cartlines").innerHTML=cartMarkup();bindCartButtons()})}
async function submitOrder(){const customer_id=Number($("#retailer").value),note=$("#ordernote").value;if(!customer_id)return toast("Choose a retailer first");if(!cart.length)return toast("Add at least one product");const payload={customer_id,items:cart.map(i=>({product_id:i.id,quantity:i.quantity})),note};try{if(editingOrder)await api("/orders/"+editingOrder.id,{method:"PUT",body:JSON.stringify(payload)});else await api("/orders",{method:"POST",body:JSON.stringify(payload)});await loadAll();editingOrder=null;cart=[];page="orders";render();toast("Order saved to Waiting")}catch(e){toast(e.message)}}
function editOrder(id){const o=orders.find(x=>x.id===id);if(!o||o.status!=="waiting")return toast("Only waiting orders can be edited");editingOrder=o;cart=o.items.map(i=>({id:i.product_id,name:i.product_name,price:i.unit_price,quantity:i.quantity})).filter(i=>i.id);page="neworder";render();$("#retailer").value=o.customer_id}
async function shareOrder(id){const o=orders.find(x=>x.id===id);if(!o)return;const total=o.items.reduce((s,i)=>s+(Number(i.unit_price)||0)*i.quantity,0);const msg=["*DAI BHAI KHADYA STORES*","Order: DB-"+String(o.id).padStart(4,"0"),"Status: "+o.status.toUpperCase(),"Retailer: "+(o.shop_name||o.customer_name),"Salesman: "+o.salesman_name,"Date: "+new Date(o.created_at+"Z").toLocaleString(),"","Items:",...o.items.map(i=>"- "+i.product_name+" × "+i.quantity+(i.unit_price!=null?" = "+money(i.unit_price*i.quantity):"")),"", "Reference total: "+(total?money(total):"Prices not fully set"),o.note?"Note: "+o.note:""].filter(Boolean).join("\n");try{await navigator.clipboard.writeText(msg);toast("Order text copied; opening WhatsApp")}catch{}window.open("https://wa.me/?text="+encodeURIComponent(msg),"_blank","noopener")}
function modal(title,body,onsubmit){$("#modalroot").innerHTML='<div class="overlay" id="overlay"><div class="modal"><div class="modalhead"><h3>'+title+'</h3><button class="btn" id="closemodal">✕</button></div><div id="modalnotice"></div>'+body+'</div></div>';$("#closemodal").onclick=closeModal;$("#overlay").onclick=e=>{if(e.target.id==="overlay")closeModal()};if(onsubmit)onsubmit()}
function closeModal(){$("#modalroot").innerHTML=""}
function productModal(p=null){modal(p?"Edit product":"Add product",'<form id="productform" class="formgrid"><div class="formfield full"><label>Product name *</label><input class="field" name="name" required value="'+esc(p?.name||"")+'"></div><div class="formfield"><label>Category</label><input class="field" name="category" value="'+esc(p?.category||"other")+'"></div><div class="formfield"><label>Reference price (optional)</label><input class="field" name="price" type="number" min="0" step=".01" value="'+(p?.price??"")+'"></div><div class="formfield"><label>SKU / item code</label><input class="field" name="sku" value="'+esc(p?.sku||"")+'"></div><div class="formfield full"><label>Image URL or filename</label><input class="field" name="image" value="'+esc(p?.image||"")+'" placeholder="e.g. dew.jpg or https://…"></div><div class="formfield full"><p class="help">Use a verified product photo URL or an image filename from the existing store repository.</p></div><div class="modalfoot formfield full"><button type="button" class="btn" id="cancelmodal">Cancel</button><button class="btn primary" type="submit">Save product</button></div></form>',()=>{$("#cancelmodal").onclick=closeModal;$("#productform").onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.currentTarget));d.price=d.price===""?null:Number(d.price);try{await api("/products"+(p?"/"+p.id:""),{method:p?"PUT":"POST",body:JSON.stringify(d)});await loadAll();closeModal();render();toast("Product saved")}catch(err){$("#modalnotice").innerHTML='<div class="notice error">'+esc(err.message)+'</div>'}}})}
function importModal(){modal("Import product spreadsheet",'<p class="sub" style="margin-bottom:16px">Upload .xlsx, .xls or .csv. The first worksheet is read. Recommended columns: Product Name, Category, Price, SKU, Image URL. Existing SKU matches are updated.</p><form id="importform"><div class="formfield"><label>Excel / CSV file</label><input class="field" type="file" name="file" accept=".xlsx,.xls,.csv" required></div><div class="modalfoot"><button type="button" class="btn" id="cancelmodal">Cancel</button><button type="submit" class="btn primary">Import products</button></div></form>',()=>{$("#cancelmodal").onclick=closeModal;$("#importform").onsubmit=async e=>{e.preventDefault();const b=e.currentTarget.querySelector('[type=submit]');b.disabled=true;b.textContent="Importing…";try{const d=await api("/products/import",{method:"POST",body:new FormData(e.currentTarget)});await loadAll();closeModal();render();toast("Imported "+d.added+" new, updated "+d.updated+", skipped "+d.skipped)}catch(err){b.disabled=false;b.textContent="Import products";$("#modalnotice").innerHTML='<div class="notice error">'+esc(err.message)+'</div>'}}})}
function customerModal(c=null){modal(c?"Edit retailer":"Add retailer",'<form id="customerform" class="formgrid"><div class="formfield"><label>Contact name *</label><input class="field" name="name" required value="'+esc(c?.name||"")+'"></div><div class="formfield"><label>Shop name</label><input class="field" name="shop_name" value="'+esc(c?.shop_name||"")+'"></div><div class="formfield"><label>Phone</label><input class="field" name="phone" value="'+esc(c?.phone||"")+'"></div><div class="formfield"><label>Address / area</label><input class="field" name="address" value="'+esc(c?.address||"")+'"></div><div class="formfield full"><label>Notes</label><textarea class="field" name="notes">'+esc(c?.notes||"")+'</textarea></div><div class="modalfoot formfield full"><button type="button" class="btn" id="cancelmodal">Cancel</button><button class="btn primary">Save retailer</button></div></form>',()=>{$("#cancelmodal").onclick=closeModal;$("#customerform").onsubmit=async e=>{e.preventDefault();try{await api("/customers"+(c?"/"+c.id:""),{method:c?"PUT":"POST",body:JSON.stringify(Object.fromEntries(new FormData(e.currentTarget)))});await loadAll();closeModal();render();toast("Retailer saved")}catch(err){$("#modalnotice").innerHTML='<div class="notice error">'+esc(err.message)+'</div>'}}})}
function userModal(){modal("Add salesman login",'<p class="sub">Salesmen can create and edit their own Waiting orders. Only the owner can dispatch or cancel.</p><form id="userform" class="loginform"><div class="formfield"><label>Full name</label><input class="field" name="name" required></div><div class="formfield"><label>Email</label><input class="field" type="email" name="email" required></div><div class="formfield"><label>Temporary password (10+ characters)</label><input class="field" type="password" name="password" minlength="10" required></div><div class="modalfoot"><button type="button" class="btn" id="cancelmodal">Cancel</button><button class="btn primary">Create login</button></div></form>',()=>{$("#cancelmodal").onclick=closeModal;$("#userform").onsubmit=async e=>{e.preventDefault();try{await api("/users",{method:"POST",body:JSON.stringify(Object.fromEntries(new FormData(e.currentTarget)))});await loadAll();closeModal();render();toast("Salesman account created")}catch(err){$("#modalnotice").innerHTML='<div class="notice error">'+esc(err.message)+'</div>'}}})}
init();
</script></body></html>
